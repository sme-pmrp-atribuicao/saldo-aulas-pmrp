<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Saldo de Aulas - SME Ribeirão Preto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background: #f4f6f9; color: #1e293b; padding-bottom: 32px; }
    header { background: #1a365d; color: #fff; padding: 16px 12px; text-align: center; }
    header h1 { font-size: 14px; margin-bottom: 3px; }
    header h2 { font-size: 13px; font-weight: normal; margin-bottom: 3px; }
    header h3 { font-size: 12px; color: #93c5fd; }
    .container { max-width: 680px; margin: 0 auto; padding: 16px; }
    .titulo { font-size: 16px; font-weight: bold; color: #1a365d; text-align: center; margin-bottom: 14px; }
    .grid-cargos { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 480px) { .grid-cargos { grid-template-columns: 1fr 1fr; } }
    .btn-cargo {
      background: #fff; border: 1px solid #cbd5e1; border-left: 5px solid #2b6cb0;
      border-radius: 8px; padding: 16px; font-size: 15px; font-weight: bold;
      color: #1e293b; text-align: left; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center;
    }
    .btn-cargo:active { background: #eff6ff; }
    #tela2 { display: none; }
    .topo-tela2 {
      display: flex; justify-content: space-between; align-items: center;
      background: #e2e8f0; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
    }
    .btn-voltar {
      background: #1a365d; color: #fff; border: none; border-radius: 6px;
      padding: 8px 14px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .badge-cargo { font-size: 15px; font-weight: bold; color: #1a365d; }
    .barra-status {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; font-size: 12px; color: #475569; margin-bottom: 12px; padding: 0 2px;
    }
    .status-ao-vivo { color: #166534; font-weight: bold; }
    .status-alerta { color: #b45309; font-weight: bold; }
    .box-filtros {
      background: #fff; padding: 12px; border-radius: 8px;
      border: 1px solid #cbd5e1; margin-bottom: 12px;
    }
    .filtros-topo-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .filtros-rotulo { font-size: 12px; font-weight: bold; color: #475569; text-transform: uppercase; }
    .btn-limpar {
      background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1;
      border-radius: 5px; padding: 5px 9px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .campo-busca {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px;
    }
    .botoes-status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .btn-filtro {
      padding: 9px 4px; font-size: 12px; font-weight: bold;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #475569;
      border-radius: 6px; cursor: pointer;
    }
    .btn-filtro.ativo { background: #1a365d; color: #fff; border-color: #1a365d; }
    .grupo-filtro-extra {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2e8f0;
    }
    .label-extra { font-size: 11px; font-weight: bold; color: #64748b; display: block; margin-bottom: 6px; text-transform: uppercase; }
    .lista-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn-pill {
      padding: 6px 10px; font-size: 12px; font-weight: bold;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #1e293b;
      border-radius: 16px; cursor: pointer;
    }
    .btn-pill.ativo { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
    .box-disciplinas { display: none; }
    .painel-resumo {
      background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 12px;
    }
    .contagem { font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 8px; }
    .totais-aulas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .total-box { border-radius: 6px; padding: 8px 10px; font-size: 12px; font-weight: bold; }
    .total-box.disp { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .total-box.atrib { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .total-num { font-size: 16px; display: block; margin-top: 2px; }
    .card {
      background: #fff; border-radius: 8px; padding: 14px;
      border: 1px solid #cbd5e1; border-left-width: 6px; margin-bottom: 10px;
    }
    .card.disp { border-left-color: #22c55e; }
    .card.atrib { border-left-color: #ef4444; }
    .card.alterado {
      box-shadow: 0 0 0 2px #f59e0b, 0 4px 10px rgba(245, 158, 11, 0.25);
      background: #fffbeb;
    }
    .card-topo {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9;
    }
    .escola { font-size: 15px; font-weight: bold; color: #1e293b; }
    .tag-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .tag-novo-status {
      font-size: 10px; font-weight: bold; background: #fef3c7; color: #92400e;
      border: 1px solid #f59e0b; padding: 3px 6px; border-radius: 4px; text-transform: uppercase;
    }
    .tag {
      font-size: 11px; font-weight: bold; padding: 4px 8px;
      border-radius: 4px; text-transform: uppercase; white-space: nowrap;
    }
    .tag.disp { background: #dcfce7; color: #166534; }
    .tag.atrib { background: #fee2e2; color: #991b1b; }
    .card-dados { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dado-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold; }
    .dado-valor { font-size: 14px; font-weight: bold; color: #1e293b; }
    .dado-aulas { font-size: 16px; font-weight: bold; color: #1a365d; }
    .col-2 { grid-column: span 2; }
    .aviso {
      text-align: center; padding: 24px; background: #fff;
      border-radius: 8px; border: 1px dashed #cbd5e1; color: #64748b; font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>PREFEITURA MUNICIPAL DE RIBEIRÃO PRETO</h1>
    <h2>SECRETARIA MUNICIPAL DA EDUCAÇÃO</h2>
    <h3>GERÊNCIA DE ATRIBUIÇÃO</h3>
  </header>

  <div class="container">
    <div id="tela1">
      <div class="titulo">SELECIONE O CARGO</div>
      <div class="grid-cargos">
        <button type="button" class="btn-cargo" onclick="abrirCargo('PEB I')"><span>PEB I</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('PEB II')"><span>PEB II</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('ARTE')"><span>ARTE</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('CIÊNCIAS')"><span>CIÊNCIAS</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('EDUCAÇÃO FÍSICA')"><span>EDUCAÇÃO FÍSICA</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('GEOGRAFIA')"><span>GEOGRAFIA</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('HISTÓRIA')"><span>HISTÓRIA</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('LÍNGUA INGLESA')"><span>LÍNGUA INGLESA</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('LÍNGUA PORTUGUESA')"><span>LÍNGUA PORTUGUESA</span><span>&#8250;</span></button>
        <button type="button" class="btn-cargo" onclick="abrirCargo('MATEMÁTICA')"><span>MATEMÁTICA</span><span>&#8250;</span></button>
      </div>
    </div>

    <div id="tela2">
      <div class="topo-tela2">
        <button type="button" class="btn-voltar" onclick="voltar()">&#8592; Voltar</button>
        <div class="badge-cargo" id="nomeCargo"></div>
      </div>

      <div class="barra-status">
        <span class="status-ao-vivo" id="indicadorSync">&#9679; Auto-atualização (20s)</span>
        <span id="horaAtualizacao">Sincronizando...</span>
      </div>

      <div class="box-filtros">
        <div class="filtros-topo-row">
          <span class="filtros-rotulo">Filtros</span>
          <button type="button" class="btn-limpar" onclick="limparFiltros()">Limpar filtros</button>
        </div>

        <input type="text" id="buscaEscola" class="campo-busca" placeholder="Digite parte do nome da escola..." oninput="filtrar()">

        <div class="botoes-status">
          <button type="button" class="btn-filtro ativo" id="fTodos" onclick="setStatus('TODOS')">Saldo Inicial</button>
          <button type="button" class="btn-filtro" id="fDisp" onclick="setStatus('DISP')">Disponíveis</button>
          <button type="button" class="btn-filtro" id="fAtrib" onclick="setStatus('ATRIB')">Atribuídas</button>
        </div>

        <div class="grupo-filtro-extra">
          <span class="label-extra">Período</span>
          <div class="lista-pills" id="listaPeriodo"></div>
        </div>

        <div class="grupo-filtro-extra box-disciplinas" id="boxDisc">
          <span class="label-extra">Disciplina</span>
          <div class="lista-pills" id="listaDisc"></div>
        </div>
      </div>

      <div class="painel-resumo">
        <div class="contagem" id="contagem"></div>
        <div class="totais-aulas">
          <div class="total-box disp">
            <span>Aulas Disponíveis</span>
            <span class="total-num" id="totalDisp">0</span>
          </div>
          <div class="total-box atrib">
            <span>Aulas Atribuídas</span>
            <span class="total-num" id="totalAtrib">0</span>
          </div>
        </div>
      </div>

      <div id="conteudoCards"></div>
    </div>
  </div>

  <script>
    // Cole aqui os links CSV gerados em "Arquivo > Compartilhar > Publicar na Web"
    var URLS_CSV = {
      'PEB I': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=372369644&single=true&output=csv',
      'PEB II': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=501827691&single=true&output=csv',
      'ARTE': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=1791807749&single=true&output=csv',
      'CIÊNCIAS': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=1829439472&single=true&output=csv',
      'EDUCAÇÃO FÍSICA': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=1879961278&single=true&output=csv',
      'GEOGRAFIA': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=250121415&single=true&output=csv',
      'HISTÓRIA': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=549092330&single=true&output=csv',
      'LÍNGUA INGLESA': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=902478054&single=true&output=csv',
      'LÍNGUA PORTUGUESA': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=1903026972&single=true&output=csv',
      'MATEMÁTICA': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdXFaamp_UmPdN8qIhVVuJg20ljVFGHrX43-9pLkldyA1CQQqmkHXAP-wQl4dW5Sks6l78yE0fNgFk/pub?gid=1923005275&single=true&output=csv'
    };

    var INTERVALO_MS = 20000;
    var cargoAtivo = '';
    var registros = [];
    var statusAnteriorPorChave = {};
    var chavesDestacadas = {};
    var primeiraCarga = true;
    var carregandoAtual = false;
    var statusFiltro = 'TODOS';
    var periodoFiltro = 'TODOS';
    var discFiltro = 'TODAS';
    var intervalo = null;

    function parseCSV(texto) {
      var linhas = [];
      var linhaAtual = [];
      var valorAtual = '';
      var entreAspas = false;

      for (var i = 0; i < texto.length; i++) {
        var ch = texto[i];
        var prox = texto[i + 1];

        if (entreAspas) {
          if (ch === '"' && prox === '"') {
            valorAtual += '"';
            i++;
          } else if (ch === '"') {
            entreAspas = false;
          } else {
            valorAtual += ch;
          }
        } else {
          if (ch === '"') {
            entreAspas = true;
          } else if (ch === ',') {
            linhaAtual.push(valorAtual);
            valorAtual = '';
          } else if (ch === '\r' && prox === '\n') {
            linhaAtual.push(valorAtual);
            linhas.push(linhaAtual);
            linhaAtual = [];
            valorAtual = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            linhaAtual.push(valorAtual);
            linhas.push(linhaAtual);
            linhaAtual = [];
            valorAtual = '';
          } else {
            valorAtual += ch;
          }
        }
      }

      if (valorAtual.length > 0 || linhaAtual.length > 0) {
        linhaAtual.push(valorAtual);
        linhas.push(linhaAtual);
      }

      return linhas;
    }

    function abrirCargo(cargo) {
      cargoAtivo = cargo;
      primeiraCarga = true;
      carregandoAtual = false;
      statusAnteriorPorChave = {};
      chavesDestacadas = {};

      document.getElementById('nomeCargo').textContent = cargo;
      document.getElementById('tela1').style.display = 'none';
      document.getElementById('tela2').style.display = 'block';
      document.getElementById('boxDisc').style.display = (cargo === 'PEB II') ? 'block' : 'none';

      resetarVariaveisFiltro();
      document.getElementById('listaPeriodo').innerHTML = '';
      document.getElementById('listaDisc').innerHTML = '';
      document.getElementById('contagem').textContent = '';
      document.getElementById('totalDisp').textContent = '0';
      document.getElementById('totalAtrib').textContent = '0';
      document.getElementById('conteudoCards').innerHTML = '<div class="aviso">Carregando saldo de aulas...</div>';
      document.getElementById('indicadorSync').className = 'status-ao-vivo';
      document.getElementById('indicadorSync').innerHTML = '&#9679; Auto-atualização (20s)';
      document.getElementById('horaAtualizacao').textContent = 'Sincronizando...';

      carregarDados();
      if (intervalo) clearInterval(intervalo);
      intervalo = setInterval(function() {
        if (cargoAtivo && !document.hidden && !carregandoAtual) carregarDados();
      }, INTERVALO_MS);
    }

    function resetarVariaveisFiltro() {
      document.getElementById('buscaEscola').value = '';
      statusFiltro = 'TODOS';
      periodoFiltro = 'TODOS';
      discFiltro = 'TODAS';
      document.getElementById('fTodos').className = 'btn-filtro ativo';
      document.getElementById('fDisp').className = 'btn-filtro';
      document.getElementById('fAtrib').className = 'btn-filtro';
    }

    function limparFiltros() {
      resetarVariaveisFiltro();
      criarBotoesPeriodo();
      if (cargoAtivo === 'PEB II') criarBotoesDisciplina();
      filtrar();
    }

    function voltar() {
      if (intervalo) clearInterval(intervalo);
      cargoAtivo = '';
      carregandoAtual = false;
      registros = [];
      statusAnteriorPorChave = {};
      chavesDestacadas = {};
      document.getElementById('tela2').style.display = 'none';
      document.getElementById('tela1').style.display = 'block';
    }

    function carregarDados() {
      if (!cargoAtivo || carregandoAtual) return;
      var url = URLS_CSV[cargoAtivo];
      if (!url || url.indexOf('COLE_A_URL_CSV_') === 0) {
        document.getElementById('conteudoCards').innerHTML = '<div class="aviso" style="color:#991b1b;">Configure a URL CSV deste cargo em URLS_CSV.</div>';
        return;
      }

      carregandoAtual = true;
      var cargoConsulta = cargoAtivo;
      var sep = url.indexOf('?') === -1 ? '?' : '&';
      var urlSemCache = url + sep + '_t=' + Date.now();

      fetch(urlSemCache, { cache: 'no-store' })
        .then(function(resp) {
          if (!resp.ok) throw new Error('Falha ao baixar CSV (' + resp.status + ')');
          return resp.text();
        })
        .then(function(csvTexto) {
          carregandoAtual = false;
          if (cargoAtivo !== cargoConsulta) return;

          var linhas = parseCSV(csvTexto);
          var novos = [];

          for (var i = 8; i < linhas.length; i++) {
            var linha = linhas[i];
            if (!linha || linha.length < 2) continue;

            var numLinha = i + 1;
            var escola = String(linha[1] || '').trim();
            var ano = String(linha[4] || '').trim();
            var turma = String(linha[5] || '').trim();
            var periodo = String(linha[6] || '').trim();
            var disciplina = String(linha[7] || '').trim();
            var aulasRaw = String(linha[8] || '').trim();

            if (!escola && !aulasRaw) continue;

            var atribuido = String(linha[0] || '').trim().toUpperCase() === 'TRUE';
            var numConvertido = Number(aulasRaw.replace(',', '.'));
            var aulasValor = aulasRaw === '' ? 0 : (isNaN(numConvertido) ? aulasRaw : numConvertido);

            novos.push({
              chave: numLinha + '|' + escola + '|' + ano + '|' + turma + '|' + periodo + '|' + disciplina,
              atribuido: atribuido,
              escola: escola,
              ano: ano,
              turma: turma,
              periodo: periodo,
              disciplina: disciplina,
              aulas: aulasValor
            });
          }

          detectarAlteracoes(novos);
          registros = novos;

          var d = new Date();
          var h = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
          document.getElementById('indicadorSync').className = 'status-ao-vivo';
          document.getElementById('indicadorSync').innerHTML = '&#9679; Auto-atualização (20s)';
          document.getElementById('horaAtualizacao').textContent = 'Atualizado às ' + h;

          criarBotoesPeriodo();
          if (cargoAtivo === 'PEB II') criarBotoesDisciplina();
          filtrar();
        })
        .catch(function(err) {
          carregandoAtual = false;
          if (cargoAtivo !== cargoConsulta) return;
          var msg = (err && err.message) ? err.message : String(err);

          if (primeiraCarga && registros.length === 0) {
            document.getElementById('conteudoCards').innerHTML = '<div class="aviso" style="color:#991b1b;">Erro: ' + escaparHtml(msg) + '</div>';
          } else {
            document.getElementById('indicadorSync').className = 'status-alerta';
            document.getElementById('indicadorSync').innerHTML = '&#9888; Oscilação na sincronização';
          }
        });
    }

    function escaparHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function detectarAlteracoes(novos) {
      var novoMapa = {};
      for (var i = 0; i < novos.length; i++) {
        var item = novos[i];
        var chave = item.chave;
        var atualAttr = !!item.atribuido;
        novoMapa[chave] = atualAttr;

        if (!primeiraCarga && statusAnteriorPorChave.hasOwnProperty(chave) && statusAnteriorPorChave[chave] !== atualAttr) {
          marcarDestaqueTemporario(chave);
        }
      }
      statusAnteriorPorChave = novoMapa;
      primeiraCarga = false;
    }

    function marcarDestaqueTemporario(chave) {
      chavesDestacadas[chave] = true;
      setTimeout(function() {
        delete chavesDestacadas[chave];
        if (cargoAtivo) filtrar();
      }, 6000);
    }

    function criarBotoesPeriodo() {
      var box = document.getElementById('listaPeriodo');
      var mapa = {};
      var lista = [];
      for (var i = 0; i < registros.length; i++) {
        var p = registros[i].periodo;
        if (p && !mapa[p]) {
          mapa[p] = true;
          lista.push(p);
        }
      }
      lista.sort();
      if (periodoFiltro !== 'TODOS' && !mapa[periodoFiltro]) periodoFiltro = 'TODOS';

      box.innerHTML = '';
      var btnTodos = document.createElement('button');
      btnTodos.type = 'button';
      btnTodos.className = 'btn-pill' + (periodoFiltro === 'TODOS' ? ' ativo' : '');
      btnTodos.textContent = 'Todos';
      btnTodos.onclick = function() { setPeriodo('TODOS'); };
      box.appendChild(btnTodos);

      for (var j = 0; j < lista.length; j++) {
        (function(valPeriodo) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-pill' + (periodoFiltro === valPeriodo ? ' ativo' : '');
          btn.textContent = valPeriodo;
          btn.onclick = function() { setPeriodo(valPeriodo); };
          box.appendChild(btn);
        })(lista[j]);
      }
    }

    function setPeriodo(p) {
      periodoFiltro = p;
      criarBotoesPeriodo();
      filtrar();
    }

    function criarBotoesDisciplina() {
      var box = document.getElementById('listaDisc');
      var mapa = {};
      var lista = [];
      for (var i = 0; i < registros.length; i++) {
        var d = registros[i].disciplina;
        if (d && !mapa[d]) {
          mapa[d] = true;
          lista.push(d);
        }
      }
      lista.sort();
      if (discFiltro !== 'TODAS' && !mapa[discFiltro]) discFiltro = 'TODAS';

      box.innerHTML = '';
      var btnTodas = document.createElement('button');
      btnTodas.type = 'button';
      btnTodas.className = 'btn-pill' + (discFiltro === 'TODAS' ? ' ativo' : '');
      btnTodas.textContent = 'Todas';
      btnTodas.onclick = function() { setDisc('TODAS'); };
      box.appendChild(btnTodas);

      for (var j = 0; j < lista.length; j++) {
        (function(valDisc) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-pill' + (discFiltro === valDisc ? ' ativo' : '');
          btn.textContent = valDisc;
          btn.onclick = function() { setDisc(valDisc); };
          box.appendChild(btn);
        })(lista[j]);
      }
    }

    function setDisc(d) {
      discFiltro = d;
      criarBotoesDisciplina();
      filtrar();
    }

    function setStatus(st) {
      statusFiltro = st;
      document.getElementById('fTodos').className = 'btn-filtro' + (st === 'TODOS' ? ' ativo' : '');
      document.getElementById('fDisp').className = 'btn-filtro' + (st === 'DISP' ? ' ativo' : '');
      document.getElementById('fAtrib').className = 'btn-filtro' + (st === 'ATRIB' ? ' ativo' : '');
      filtrar();
    }

    function limparTexto(t) {
      return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function filtrar() {
      var busca = limparTexto(document.getElementById('buscaEscola').value.trim());
      var isPeb2 = (cargoAtivo === 'PEB II');
      var lista = [];
      var somaDisp = 0;
      var somaAtrib = 0;

      for (var i = 0; i < registros.length; i++) {
        var r = registros[i];
        if (statusFiltro === 'DISP' && r.atribuido) continue;
        if (statusFiltro === 'ATRIB' && !r.atribuido) continue;
        if (periodoFiltro !== 'TODOS' && r.periodo !== periodoFiltro) continue;
        if (isPeb2 && discFiltro !== 'TODAS' && r.disciplina !== discFiltro) continue;
        if (busca && limparTexto(r.escola).indexOf(busca) === -1) continue;

        lista.push(r);
        var qtd = parseFloat(String(r.aulas).replace(',', '.'));
        if (!isNaN(qtd)) {
          if (r.atribuido) somaAtrib += qtd;
          else somaDisp += qtd;
        }
      }

      document.getElementById('contagem').textContent = 'Exibindo ' + lista.length + ' registro(s)';
      document.getElementById('totalDisp').textContent = somaDisp;
      document.getElementById('totalAtrib').textContent = somaAtrib;

      if (lista.length === 0) {
        document.getElementById('conteudoCards').innerHTML = '<div class="aviso">Nenhum registro encontrado.</div>';
        return;
      }

      var html = '';
      for (var k = 0; k < lista.length; k++) {
        var item = lista[k];
        var cls = item.atribuido ? 'atrib' : 'disp';
        var txt = item.atribuido ? 'Atribuído' : 'Disponível';
        var emDestaque = !!chavesDestacadas[item.chave];
        var clsDestaque = emDestaque ? ' alterado' : '';
        var badgeAlterado = emDestaque ? '<span class="tag-novo-status">Atualizado</span>' : '';
        var discHtml = isPeb2 ? '<div class="col-2"><div class="dado-label">Disciplina</div><div class="dado-valor">' + escaparHtml(item.disciplina || '-') + '</div></div>' : '';

        html +=
          '<div class="card ' + cls + clsDestaque + '">' +
            '<div class="card-topo">' +
              '<div class="escola">' + escaparHtml(item.escola || '-') + '</div>' +
              '<div class="tag-wrap">' + badgeAlterado + '<span class="tag ' + cls + '">' + txt + '</span></div>' +
            '</div>' +
            '<div class="card-dados">' +
              '<div><div class="dado-label">Ano / Turma</div><div class="dado-valor">' + escaparHtml(item.ano || '-') + (item.turma ? ' • ' + escaparHtml(item.turma) : '') + '</div></div>' +
              '<div><div class="dado-label">Período</div><div class="dado-valor">' + escaparHtml(item.periodo || '-') + '</div></div>' +
              discHtml +
              '<div class="col-2"><div class="dado-label">Aulas</div><div class="dado-aulas">' + escaparHtml(item.aulas) + '</div></div>' +
            '</div>' +
          '</div>';
      }

      document.getElementById('conteudoCards').innerHTML = html;
    }
  </script>
</body>
</html>
